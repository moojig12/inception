
secrets:
  db_root_pass.txt:
    file: ./secrets/db_root_pass.txt
  db_pass.txt:
    file: ./secrets/db_pass.txt
  wp_admin_pass.txt:
    file: ./secrets/wp_admin_pass.txt
  wp_user_pass.txt:
    file: ./secrets/wp_user_pass.txt

volumes:
  wordpress_db:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/moojig12/data/wordpress
  mariadb_db:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/moojig12/data/mariadb

networks:
  inception:
    name: inception

services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    image: mariadb:notlatest
    networks:
      - inception
    restart: unless-stopped
    volumes:
      - mariadb_db:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_pass.txt
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_pass.txt
    secrets:
      - db_root_pass.txt
      - db_pass.txt
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$(cat /run/secrets/db_root_password.txt) --silent || mysqladmin ping -h 127.0.0.1 --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    image: wordpress:notlatest
    networks:
      - inception
    restart: unless-stopped
    volumes:
      - wordpress_db:/var/www/wordpress
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_pass.txt
      MYSQL_HOST: mariadb

      SITE_TITLE: ${SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}

      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_pass.txt
      WP_USER_PASSWORD_FILE: /run/secrets/wp_user_pass.txt
    secrets:
      - db_pass.txt
      - wp_admin_pass.txt
      - wp_user_pass.txt
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
    image: nginx:notlatest
    networks:
      - inception
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - wordpress_db:/var/www/wordpress
    depends_on:
      - wordpress